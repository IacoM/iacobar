[package]
name = "iacobar"
version = "0.2.0"
description = "A modern, customizable taskbar for Windows"
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix is needed on Windows to avoid a name clash with the bin.
name = "iacobar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
base64 = "0.22"
# same version the `windows` crate uses: needed by its #[interface] macro
windows-core = "0.61"
tauri-plugin-updater = "2"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Networking_NetworkListManager",
  "Win32_Storage_FileSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Shell_Common",
  "Foundation",
  "Foundation_Collections",
  "Devices_Radios",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Networking_Connectivity",
  "Media_Control",
  "Storage_Streams",
  "Devices_WiFi",
  "Win32_NetworkManagement_WiFi",
  "Win32_NetworkManagement_Ndis",  "Security_Credentials",
  "Win32_Graphics_Imaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
